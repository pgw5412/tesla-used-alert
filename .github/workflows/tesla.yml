name: Tesla used inventory alerts

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tesla-inventory
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser
        run: |
          python -m pip install 'playwright>=1.48,<2'
          python -m playwright install --with-deps chromium

      - name: Check four models
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat > /tmp/tesla_monitor.py <<'PYTHON'
          import json
          import os
          import re
          import time
          import urllib.request
          import urllib.parse
          from pathlib import Path

          STATE = Path('inventory-state.json')
          MODEL = ''
          LABEL = ''
          URL = ''

          def save(state):
              tmp = STATE.with_suffix('.tmp')
              with tmp.open('w', encoding='utf-8') as f:
                  json.dump(state, f, ensure_ascii=False, indent=2)
                  f.flush()
                  os.fsync(f.fileno())
              tmp.replace(STATE)

          def telegram(config, method, **args):
              request = urllib.request.Request(
                  'https://api.telegram.org/bot'
                  + config['token'] + '/' + method,
                  data=json.dumps(args).encode(),
                  headers={'Content-Type': 'application/json'}
              )
              try:
                  with urllib.request.urlopen(request, timeout=35) as response:
                      result = json.load(response)
              except Exception:
                  raise RuntimeError(
                      '텔레그램 요청 실패: 네트워크·토큰·채팅 설정 확인'
                  ) from None
              if not result.get('ok'):
                  raise RuntimeError('텔레그램 요청이 거절되었습니다.')
              return result['result']

          def send(config, text):
              telegram(
                  config,
                  'sendMessage',
                  chat_id=config['chat_id'],
                  text=text,
                  link_preview_options={'is_disabled': True}
              )

          def parse_payload(data):
              if not isinstance(data, dict):
                  raise ValueError('조회 응답이 객체가 아닙니다.')
              if 'total_matches_found' not in data:
                  raise ValueError('목록 합계 항목이 없습니다.')
              total = int(data['total_matches_found'])
              rows = data.get('results')
              if isinstance(rows, dict):
                  rows = rows.get('exact')
              if not isinstance(rows, list) or total < 0:
                  raise ValueError('불완전한 목록 응답')
              return total, rows

          def fetch_inventory():
              from playwright.sync_api import sync_playwright

              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  try:
                      page = browser.new_page(locale='ko-KR')
                      payloads = []
                      api_notes = []

                      def receive(response):
                          if (
                              '/inventory/api/' not in response.url
                              or 'inventory-results' not in response.url
                          ):
                              return
                          api_notes.append(f'HTTP {response.status}')
                          try:
                              if not response.ok:
                                  return
                              params = urllib.parse.parse_qs(
                                  urllib.parse.urlsplit(response.url).query
                              )
                              query = json.loads(params['query'][0])
                              filters = query['query']
                              if (
                                  filters.get('model') != MODEL
                                  or filters.get('condition') != 'used'
                              ):
                                  return
                              total, rows = parse_payload(response.json())
                              payloads.append((total, rows))
                          except Exception as exc:
                              api_notes.append(
                                  '응답 해석 실패: '
                                  + type(exc).__name__
                              )

                      page.on('response', receive)
                      response = page.goto(
                          URL,
                          wait_until='domcontentloaded',
                          timeout=60000
                      )
                      status = response.status if response else '응답 없음'
                      print(
                          f'{LABEL}: 페이지 HTTP {status}',
                          flush=True
                      )

                      deadline = time.monotonic() + 90
                      body = ''
                      challenge_logged = False

                      while time.monotonic() < deadline:
                          page.wait_for_timeout(1500)
                          body = page.locator('body').inner_text(
                              timeout=10000
                          )
                          challenge = re.search(
                              r'verify you are human|access denied|'
                              r'checking your browser',
                              body,
                              re.I
                          )
                          if challenge:
                              if not challenge_logged:
                                  print(
                                      f'{LABEL}: 접근 거부 또는 브라우저 '
                                      '확인 문구 감지. 제한 시간까지 기다립니다.',
                                      flush=True
                                  )
                                  challenge_logged = True
                              continue

                          if payloads:
                              totals = {item[0] for item in payloads}
                              if len(totals) != 1:
                                  raise RuntimeError(
                                      '조회 중 목록 합계가 변경되었습니다.'
                                  )
                              total = next(iter(totals))
                              vins = set()
                              for _, rows in payloads:
                                  for row in rows:
                                      vin = row.get('VIN', '')
                                      if not re.fullmatch(
                                          r'[A-HJ-NPR-Z0-9]{17}', vin
                                      ):
                                          raise RuntimeError(
                                              '차량 식별번호 구조 변경'
                                          )
                                      vins.add(vin)

                              if len(vins) == total:
                                  cards = page.locator(
                                      'article[data-id]'
                                  ).evaluate_all(
                                      """els => els.map(e => ({
                                          id: e.getAttribute('data-id'),
                                          text: e.innerText
                                      }))"""
                                  )
                                  texts = {
                                      card['id'].split('-')[0]: card['text']
                                      for card in cards
                                  }
                                  return {
                                      vin: texts.get(
                                          vin, LABEL + ' 인증중고차'
                                      )[:1600]
                                      for vin in sorted(vins)
                                  }

                          page.mouse.wheel(0, 1800)

                      title = page.title()
                      excerpt = re.sub(r'\s+', ' ', body).strip()[:180]
                      notes = ', '.join(api_notes[-3:]) or 'API 응답 미수신'
                      raise RuntimeError(
                          f'90초 후 조회 실패. 페이지 HTTP: {status}. '
                          f'제목: {title[:70]}. '
                          f'목록 응답: {len(payloads)}개. '
                          f'API: {notes}. 화면: {excerpt}'
                      )
                  finally:
                      browser.close()

          def transition(old, current):
              if old is None or not old.get('initialized', True):
                  return {
                      'initialized': True,
                      'known': current,
                      'misses': {},
                      'outbox': [
                          f'✅ {LABEL}: {len(current)}대 기준 저장 완료. '
                          '이후 변화를 알립니다.'
                      ],
                      'failures': 0
                  }, 0

              known = dict(old['known'])
              misses = dict(old.get('misses', {}))
              outbox = list(old.get('outbox', []))
              changes = 0

              for vin, detail in current.items():
                  if vin not in known:
                      outbox.append(
                          f'{LABEL}\n🟢 차량 추가\n'
                          f'VIN: {vin}\n{detail}\n\n{URL}'
                      )
                      changes += 1
                  known[vin] = detail
                  misses.pop(vin, None)

              for vin in list(known):
                  if vin not in current:
                      misses[vin] = misses.get(vin, 0) + 1
                      if misses[vin] >= 2:
                          detail = known.pop(vin)
                          outbox.append(
                              f'{LABEL}\n'
                              '🔴 목록에서 사라짐 (판매완료 여부 미확인)\n'
                              f'VIN: {vin}\n{detail}\n\n{URL}'
                          )
                          misses.pop(vin)
                          changes += 1

              return {
                  'initialized': True,
                  'known': known,
                  'misses': misses,
                  'outbox': outbox,
                  'failures': 0
              }, changes

          def drain(config, model_state, state):
              while model_state.get('outbox'):
                  send(config, model_state['outbox'][0])
                  model_state['outbox'].pop(0)
                  save(state)
                  time.sleep(1)

          def main():
              global MODEL, LABEL, URL

              config = {
                  'token': os.environ['TELEGRAM_BOT_TOKEN'].strip(),
                  'chat_id': os.environ['TELEGRAM_CHAT_ID'].strip()
              }
              if not config['token'] or not config['chat_id']:
                  raise RuntimeError('GitHub Secrets 두 항목을 확인하세요.')

              state = (
                  json.loads(STATE.read_text(encoding='utf-8'))
                  if STATE.exists()
                  else {'models': {}}
              )
              state.setdefault('models', {})
              manual = (
                  os.environ.get('GITHUB_EVENT_NAME')
                  == 'workflow_dispatch'
              )

              telegram(config, 'getMe')
              if not state.get('connection_tested'):
                  send(
                      config,
                      '✅ GitHub ↔ 텔레그램 연결 성공. '
                      'Model 3/Y/S/X 조회를 시작합니다. '
                      '조회 성공 여부는 별도로 알려드립니다.'
                  )
                  state['connection_tested'] = True
                  save(state)

              failed = []
              summary = []
              models = [
                  ('m3', 'Model 3'),
                  ('my', 'Model Y'),
                  ('ms', 'Model S'),
                  ('mx', 'Model X')
              ]

              for MODEL, LABEL in models:
                  URL = (
                      'https://www.tesla.com/ko_KR/inventory/used/'
                      f'{MODEL}?arrangeby=plh&zip=&range=0'
                  )
                  old = state['models'].get(MODEL)

                  try:
                      if old:
                          drain(config, old, state)

                      current = fetch_inventory()
                      new, changes = transition(old, current)
                      state['models'][MODEL] = new
                      save(state)
                      drain(config, new, state)

                      summary.append(f'{LABEL}: {len(current)}대 정상')
                      print(
                          f'{LABEL}: {len(current)} vehicles; '
                          f'{changes} changes',
                          flush=True
                      )

                  except Exception as exc:
                      failed.append(LABEL)
                      previous = state['models'].get(MODEL)

                      if previous is None:
                          previous = {
                              'initialized': False,
                              'known': {},
                              'misses': {},
                              'outbox': [],
                              'failures': 0
                          }
                          state['models'][MODEL] = previous

                      previous['failures'] = (
                          previous.get('failures', 0) + 1
                      )
                      previous['misses'] = {}
                      count = previous['failures']
                      reason = str(exc).replace(
                          config['token'], '[숨김]'
                      )[:700]

                      if manual or count in (1, 3):
                          try:
                              send(
                                  config,
                                  f'⚠️ {LABEL} 조회 또는 전송 실패.\n'
                                  '既存一覧' .replace('既存一覧', '기존 목록')
                                  + '을 유지합니다.\n'
                                  + f'오류: {type(exc).__name__}\n'
                                  + f'상세: {reason}'
                              )
                          except Exception:
                              pass

                      summary.append(f'{LABEL}: 실패')
                      print(
                          LABEL,
                          'failed:',
                          type(exc).__name__,
                          reason,
                          flush=True
                      )
                      save(state)

                  time.sleep(3)

              state['last_check_utc'] = time.strftime(
                  '%Y-%m-%dT%H:%M:%SZ', time.gmtime()
              )
              save(state)

              if manual:
                  send(
                      config,
                      '수동 점검 결과\n' + '\n'.join(summary)
                  )

              if failed:
                  raise SystemExit(1)

          if __name__ == '__main__':
              main()
          PYTHON
          python /tmp/tesla_monitor.py

      - name: Save inventory state
        if: always()
        run: |
          if [ -f inventory-state.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add inventory-state.json
            if ! git diff --cached --quiet; then
              git commit -m 'Update inventory snapshot'
              git push
            fi
          fi
